<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script defer src="script.js"></script> <!-- Wstawienie wspólnego pliku JS -->
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo" />
        </div>
        <h1>Kontakt</h1>
        <button id="theme-toggle">🌓</button>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Strona Główna</a></li>
            <li><a href="#about">O mnie</a></li>
            <li><a href="#projects">Projekty</a></li>
            <li><a href="#contact">Kontakt</a></li>
        </ul>
    </nav>
    <section id="contact">
        <h2>Formularz kontaktowy</h2>
        <div class="form-container">
            <form id="contact-form">
                <input type="text" name="name" placeholder="Twoje imię" required>
                <input type="email" name="email" placeholder="Twój email" required>
                <textarea name="message" placeholder="Twoja wiadomość" required></textarea>
                <button type="submit">Wyślij</button>
            </form>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2025 Kamil Pietrzak</p>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/kamilpi/" class="linkedin-link" target="_blank">
                <img src="linkedin.png" alt="LinkedIn" class="linkedin-icon">
            </a>
        </div>
    </footer>
</body>
</html>
